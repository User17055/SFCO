<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pets | Planos Pet</title><script>if(sessionStorage.getItem('tpp-auth')!=='1')location.replace('login.html')</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css"></head>
<body class="bg-slate-50 text-slate-800"><div class="min-h-screen lg:flex"><aside class="bg-slate-900 text-white p-5 lg:w-64"><div class="text-xl font-bold mb-7">Planos Pet</div><nav class="grid gap-2 text-sm"><a class="hover:bg-slate-800 rounded-lg px-3 py-2" href="index.html">Visao geral</a><a class="hover:bg-slate-800 rounded-lg px-3 py-2" href="clientes.html">Clientes</a><a class="bg-blue-600 rounded-lg px-3 py-2" href="pets.html">Pets</a><a class="hover:bg-slate-800 rounded-lg px-3 py-2" href="planos.html">Planos</a></nav><button id="botao-sair" class="mt-8 text-sm text-slate-300">Sair</button></aside>
<main class="flex-1 p-5 lg:p-8 min-w-0"><header class="flex flex-wrap justify-between gap-3 mb-5"><div><h1 class="text-2xl font-bold">Pets</h1><p class="text-sm text-slate-500">Cadastre ou edite pets vinculados a cada cliente.</p></div><button id="novo-pet" class="botao-primario">Novo pet</button></header><div class="painel"><div class="flex gap-3 mb-4"><input id="busca-pets" class="campo flex-1" placeholder="Buscar pet, tutor ou plano"><span id="total-pets" class="text-sm text-slate-500 self-center"></span></div><div class="overflow-x-auto"><table class="tabela"><thead><tr><th>Pet</th><th>Tutor</th><th>Dados</th><th>Planos ativos</th><th>Projecao</th><th>Acoes</th></tr></thead><tbody id="pets-body"></tbody></table></div></div></main></div>
<dialog id="modal-pet" class="modal"><form id="form-pet" class="modal-conteudo"><div class="flex justify-between"><h2 class="text-lg font-bold">Pet</h2><button type="button" data-fechar>✕</button></div><input type="hidden" name="id"><label>Tutor<select class="campo" name="clienteId" required></select></label><div class="grid sm:grid-cols-2 gap-3"><label>Nome<input class="campo" name="nome" required></label><label>Especie<input class="campo" name="especie"></label><label>Raca<input class="campo" name="raca"></label><label>Sexo<select class="campo" name="sexo"><option value="">Nao informado</option><option>Macho</option><option>Femea</option></select></label><label>Idade<input class="campo" name="idade" type="number" min="0"></label><label>Nascimento<input class="campo" name="nascimento" type="date"></label><label>Peso (kg)<input class="campo" name="peso" type="number" min="0" step="0.01"></label></div><label>Observacoes<textarea class="campo" name="observacoes" rows="2"></textarea></label><div id="erro-pet" class="text-sm text-red-700"></div><div class="flex justify-end gap-2"><button type="button" class="botao-secundario" data-fechar>Cancelar</button><button class="botao-primario">Salvar</button></div></form></dialog>
<script src="js/auth.js"></script><script src="js/layout.js"></script><script src="js/components.js"></script><script src="js/pets.js"></script></body></html>
