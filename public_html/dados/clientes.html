<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes | Planos Pet</title>
<script>if(sessionStorage.getItem('tpp-auth')!=='1')location.replace('login.html')</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css">
</head><body class="bg-slate-50 text-slate-800"><div class="min-h-screen lg:flex">
<aside class="bg-slate-900 text-white p-5 lg:w-64"><div class="text-xl font-bold mb-7">Planos Pet</div><nav class="grid gap-2 text-sm"><a class="hover:bg-slate-800 rounded-lg px-3 py-2" href="index.html">Visao geral</a><a class="bg-blue-600 rounded-lg px-3 py-2" href="clientes.html">Clientes</a><a class="hover:bg-slate-800 rounded-lg px-3 py-2" href="pets.html">Pets</a><a class="hover:bg-slate-800 rounded-lg px-3 py-2" href="planos.html">Planos</a></nav><button id="botao-sair" class="mt-8 text-sm text-slate-300">Sair</button></aside>
<main class="flex-1 p-5 lg:p-8 min-w-0"><header class="flex flex-wrap justify-between gap-3 mb-5"><div><h1 class="text-2xl font-bold">Clientes</h1><p class="text-sm text-slate-500">Edite os dados e veja pets, planos e projecao por pessoa.</p></div><button id="novo-cliente" class="botao-primario">Novo cliente</button></header>
<div class="painel"><div class="flex flex-wrap gap-3 mb-4"><input id="busca-clientes" class="campo flex-1 min-w-56" placeholder="Buscar por nome, telefone, CPF ou plano"><span id="total-clientes" class="text-sm text-slate-500 self-center"></span></div><div class="overflow-x-auto"><table class="tabela"><thead><tr><th>Cliente</th><th>Contato</th><th>Pets</th><th>Planos ativos</th><th>Projecao</th><th>Acoes</th></tr></thead><tbody id="clients-body"></tbody></table></div></div>
</main></div>
<dialog id="modal-cliente" class="modal"><form id="form-cliente" class="modal-conteudo"><div class="flex justify-between"><h2 id="titulo-cliente" class="text-lg font-bold">Cliente</h2><button type="button" data-fechar>✕</button></div><input type="hidden" name="id"><label>Nome<input class="campo" name="nome" required maxlength="150"></label><div class="grid sm:grid-cols-2 gap-3"><label>E-mail<input class="campo" name="email" type="email"></label><label>Telefone<input class="campo" name="telefone"></label><label>CPF<input class="campo" name="cpf"></label></div><label>Observacoes<textarea class="campo" name="observacoes" rows="3"></textarea></label><div id="erro-cliente" class="text-sm text-red-700"></div><div class="flex justify-end gap-2"><button type="button" class="botao-secundario" data-fechar>Cancelar</button><button class="botao-primario">Salvar</button></div></form></dialog>
<script src="js/auth.js"></script><script src="js/layout.js"></script><script src="js/components.js"></script><script src="js/clientes.js"></script></body></html>
